# Prometheus scrape config (ARCHITECT §11.1, C-12/C-13).
#
# Источник данных для всех дашбордов Grafana:
#   MVP      — mvp-overview, mvp-search-latency, mvp-indexing-health, mvp-dead-letters
#   Critical — critical-reranker, critical-eval-regression, critical-pushdown,
#              critical-circuit-breaker
# Прокси-датасорс объявлен в grafana/provisioning/datasources/datasources.yml
# (url: http://prometheus:9090) — имя/UID менять нельзя, иначе панели отдадут
# "datasource not found".

global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 15s
  external_labels:
    stack: oriahs
    phase: critical

scrape_configs:
  # API: /metrics (prometheus-fastapi-instrumentator + app/observability/metrics.py).
  # Именно эти series читают mvp-*/critical-* дашборды.
  - job_name: oriahs-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  # Qdrant отдаёт Prometheus-метрики на том же HTTP-порту, что и REST API.
  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]
        labels:
          service: qdrant

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus
