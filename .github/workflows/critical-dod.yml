name: Critical DoD Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  critical-dod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oriahs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333
        options: >-
          --health-cmd curl -f http://localhost:6333/
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd redis-cli ping
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync
    
    - name: Start services
      run: |
        docker-compose up -d
        python -c "
        import time
        import requests
        import subprocess
        
        # Wait for services to be ready
        time.sleep(30)
        
        # Wait for PostgreSQL
        while True:
            try:
                requests.get('http://localhost:5432', timeout=5)
                break
            except:
                time.sleep(2)
        
        # Wait for Qdrant
        while True:
            try:
                requests.get('http://localhost:6333', timeout=5)
                break
            except:
                time.sleep(2)
        
        # Wait for Redis
        while True:
            try:
                requests.get('http://localhost:6379', timeout=5)
                break
            except:
                time.sleep(2)
        
        print('All services ready')
        "
    
    - name: Run migrations
      run: |
        uv run alembic upgrade head
    
    - name: Run Critical DoD validation
      run: |
        bash scripts/run_dod_check_critical.sh
    
    - name: Run unit tests
      run: |
        uv run pytest tests/unit/ -x
    
    - name: Run integration tests
      run: |
        uv run pytest tests/integration/ -x --tb=short