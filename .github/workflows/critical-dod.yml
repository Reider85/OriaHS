name: Critical Daily Operations of Done (DOD) Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  dod-check:
    name: Critical DOD Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y docker.io docker-compose
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync
        
    - name: Start infrastructure
      run: |
        ./scripts/infra_up.sh --no-app
        
    - name: Wait for infrastructure
      run: |
        python -c "
        import time
        import requests
        
        # Wait for services to be ready
        services = [
            ('http://localhost:8081', 'Qdrant'),
            ('http://localhost:6379', 'Redis'),
            ('http://localhost:5432', 'PostgreSQL'),
        ]
        
        for url, name in services:
            for i in range(30):
                try:
                    if name == 'PostgreSQL':
                        import subprocess
                        result = subprocess.run(
                            ['docker', 'compose', 'exec', 'postgres', 'pg_isready'],
                            capture_output=True, text=True
                        )
                        if 'accepting connections' in result.stdout:
                            print(f'{name} is ready')
                            break
                    else:
                        response = requests.get(url, timeout=5)
                        if response.status_code == 200:
                            print(f'{name} is ready')
                            break
                except:
                    pass
                time.sleep(1)
            else:
                print(f'{name} not ready after 30 seconds')
                exit(1)
        "
        
    - name: Run linting
      run: |
        uv run ruff check app/ tests/ scripts/
        
    - name: Run formatting check
      run: |
        uv run ruff format --check app/ tests/ scripts/
        
    - name: Run type checking
      run: |
        uv run mypy app/
        
    - name: Run unit tests
      run: |
        uv run pytest tests/unit/ -v
        
    - name: Run chaos engineering tests
      run: |
        uv run pytest tests/chaos/ -m chaos -v
        
    - name: Run integration tests
      run: |
        uv run pytest tests/integration/ -v
        
    - name: Run chaos weekly runner
      run: |
        uv run python scripts/run_chaos_weekly.py
        
    - name: Stop infrastructure
      if: always()
      run: |
        ./scripts/infra_down.sh
        
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: |
          chaos_reports/
          scripts/logs/
        retention-days: 30
        
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = 'scripts/logs/dod_check_*.log';
          const logFiles = fs.readdirSync('scripts/logs').filter(file => file.startsWith('dod_check_'));
          
          if (logFiles.length > 0) {
            const latestLog = logFiles[logFiles.length - 1];
            const logContent = fs.readFileSync(`scripts/logs/${latestLog}`, 'utf8');
            
            const summary = logContent.split('\n').find(line => line.includes('Daily Operations of Done (DOD) check completed'));
            const status = summary ? '✅ All checks passed' : '❌ Some checks failed';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔍 **DOD Check Results**\n\n${status}\n\nCheck the logs for details: \`${latestLog}\``
            });
          }