receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlp:
    endpoint: tempo:4317
    compression: none
    tls:
      insecure: true

  logging:
    loglevel: debug

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
      # Export logs to Loki via OTLP/HTTP (Loki 3.x supports OTLP on /otlp endpoint)
      # Note: app logs will be sent via OTel LoggingHandler → OTLP gRPC → collector → Loki
      # This enables trace↔log correlation in Grafana
      otlp:
        endpoint: http://loki:3100/otlp
        compression: none
        tls:
          insecure: true